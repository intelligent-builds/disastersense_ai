<!-- app/templates/dashboard.html (Live map, nicer UI, auto-refresh, ORS ETA details) -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Disaster Dashboard — Live Map & ETA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root{
      --bg:#f4f7fb; --card:#ffffff; --muted:#666; --accent:#2b8af7; --danger:#dc3545;
      --radius:10px;
    }
    body { margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial; background:var(--bg); color:#222; }
    .wrap { max-width:1200px; margin:20px auto; padding:18px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:12px; }
    h1 { margin:0; font-size:20px; }
    .controls { display:flex; gap:10px; align-items:center; }
    .btn { background:#fff; border:1px solid #eaeef5; padding:8px 10px; border-radius:8px; cursor:pointer; }
    .btn.primary { background:var(--accent); color:#fff; border:0; }
    .filters { display:flex; gap:8px; align-items:center; }

    .layout { display:grid; grid-template-columns: 420px 1fr; gap:18px; margin-top:12px; }
    .panel { background:var(--card); border-radius:var(--radius); padding:12px; box-shadow:0 6px 18px rgba(20,30,50,0.04); }
    #map { width:100%; height:520px; border-radius:8px; }
    .reports-list { max-height:520px; overflow:auto; padding-right:6px; }
    .report-item { border-radius:8px; padding:12px; margin-bottom:12px; border:1px solid #f0f4fb; background:#fff; transition:box-shadow .18s; }
    .report-item:hover { box-shadow:0 8px 24px rgba(15,30,40,0.06); }
    .report-item.urgent { background:#fff6f6; border-color:#fde2e2; }
    .meta { display:flex; gap:8px; align-items:center; font-size:13px; color:var(--muted); margin-top:8px; }
    .helpers { margin-top:10px; font-size:13px; color:#333; }
    .helper-row { display:flex; justify-content:space-between; gap:8px; padding:6px 0; border-top:1px dashed #f2f6fb; align-items:center; }
    .eta { font-weight:700; color:#111; }
    .small { font-size:12px; color:var(--muted); }
    .link { color:var(--accent); text-decoration:underline; cursor:pointer; font-size:13px; }

    /* legend */
    .legend { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
    .legend .litem { display:flex; align-items:center; gap:6px; font-size:13px; }
    .dot { width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,0.06); }

    /* responsive */
    @media (max-width:980px) {
      .layout { grid-template-columns: 1fr; }
      #map { height:360px; }
      .reports-list { max-height:360px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Disaster Dashboard — Live Map & ETA</h1>
        <div class="small">Auto-refresh every <span id="refreshSecs">15</span>s · Click a report to focus map</div>
      </div>
      <div class="controls">
        <div class="filters">
          <label><input id="emOnly" type="checkbox"> Emergencies only</label>
        </div>
        <button id="refreshBtn" class="btn">Refresh</button>
        <button id="centerBtn" class="btn">Center on selected</button>
        <button id="pauseBtn" class="btn">Pause</button>
      </div>
    </header>

    <div class="layout">
      <div class="panel">
        <div class="legend">
          <div class="litem"><span class="dot" style="background:#2b8af7"></span> Report</div>
          <div class="litem"><span class="dot" style="background:#28a745"></span> Helper</div>
        </div>

        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <input id="q" placeholder="search message / helper..." style="flex:1;padding:8px;border-radius:8px;border:1px solid #e9eef8;" />
          <button id="forceAll" class="btn">Refresh ETA (all)</button>
        </div>

        <div class="reports-list" id="reportsList">
          <!-- injected items -->
        </div>
      </div>

      <div class="panel">
        <div id="map"></div>
      </div>
    </div>
  </div>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  // Dashboard script with map, auto-refresh & helper lines
  const REFRESH_INTERVAL = 15000; // 15s
  let autoRefresh = true;
  let refreshTimer = null;
  let selectedReportId = null;

  // map + layers
  const map = L.map('map', {zoomControl:true}).setView([20.5937,78.9629], 5); // center India by default
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const reportLayer = L.layerGroup().addTo(map);
  const helperLayer = L.layerGroup().addTo(map);
  const routeLayer = L.layerGroup().addTo(map);

  // icons (simple SVG markers)
  const reportIcon = L.divIcon({className: '', html: '<svg width="18" height="18"><circle cx="9" cy="9" r="8" fill="#2b8af7" stroke="#fff" stroke-width="2"/></svg>'});
  const helperIcon = L.divIcon({className:'', html: '<svg width="16" height="16"><rect rx="3" width="16" height="16" fill="#28a745" stroke="#fff" stroke-width="2"/></svg>'});

  // helpers map: id->marker
  const markers = { reports: {}, helpers: {} };

  async function fetchReports() {
    const n=50;
    try {
      const res = await fetch('/reports/recent?n=' + n);
      if (!res.ok) return [];
      return await res.json();
    } catch (e) {
      console.error("fetchReports error", e);
      return [];
    }
  }

  function clearMap() {
    reportLayer.clearLayers();
    helperLayer.clearLayers();
    routeLayer.clearLayers();
    for (const k in markers.reports) delete markers.reports[k];
    for (const k in markers.helpers) delete markers.helpers[k];
  }

  function setPing(el) {
    el.style.transition = 'background 0.3s';
    el.style.background = '#eaf6ff';
    setTimeout(()=> el.style.background = '', 500);
  }

  function buildReportItem(r) {
    const div = document.createElement('div');
    div.className = 'report-item' + (r.is_emergency ? ' urgent' : '');
    div.dataset.rid = r.id;

    let people = '-';
    if (r.ml_info && r.ml_info.people !== undefined && r.ml_info.people !== null) people = r.ml_info.people;
    else if (r.people !== undefined) people = r.people;

    const summary = (r.ml_info && r.ml_info.gemini && r.ml_info.gemini.summary) ? r.ml_info.gemini.summary : (r.summary || '-');
    const urgency = (r.ml_info && r.ml_info.gemini && r.ml_info.gemini.urgency) ? r.ml_info.gemini.urgency : (r.urgency_label||'-');

    div.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div><strong>#${r.id}</strong> <span class="small">${r.created_at ? r.created_at.split('T')[0] : ''}</span></div>
        <div style="text-align:right">
          <div class="small">${r.location_text||'no location'}</div>
          <div style="margin-top:6px"><span class="eta">${r.assigned_helpers && r.assigned_helpers.length ? (r.assigned_helpers[0].eta || '-') : '-'}</span></div>
        </div>
      </div>
      <div style="margin-top:8px; color:#333">${escapeHtml(r.message || summary)}</div>
      <div class="meta" style="margin-top:8px">
        <div>People: <strong>${people}</strong></div>
        <div>Urgency: <strong>${urgency}</strong></div>
        <div style="margin-left:auto"><a class="link" onclick="centerOnReport(${r.id})">Center</a></div>
      </div>
      <div class="helpers" id="helpers-${r.id}">
        ${renderHelpersShort(r.assigned_helpers||[])}
      </div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn" onclick="forceRecompute(${r.id}, this)">Refresh ETA (force)</button>
        <button class="btn" onclick="resolve(${r.id}, this)">Mark resolved</button>
      </div>
    `;
    div.addEventListener('click', ()=> {
      selectedReportId = r.id;
      highlightReportOnMap(r);
      setPing(div);
    });
    return div;
  }

  function renderHelpersShort(helpers) {
    if (!helpers || helpers.length===0) return '<div class="small">No helpers assigned</div>';
    return helpers.map(h => {
      const secs = (h.eta_seconds!==undefined && h.eta_seconds!==null) ? `${Number(h.eta_seconds).toFixed(1)}s` : '';
      const dist = (h.eta_distance_km!==undefined && h.eta_distance_km!==null) ? `${Number(h.eta_distance_km).toFixed(3)}km` : (h.dist_km!==undefined ? `${h.dist_km}km` : '');
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0"><div><strong>${escapeHtml(h.name||h.email||'helper')}</strong><div class="small">${escapeHtml(h.email||'')}</div></div><div style="text-align:right"><div class="eta">${escapeHtml(h.eta||'-')}</div><div class="small">${escapeHtml((secs? secs+' ':'') + (dist? dist : ''))}</div></div></div>`;
    }).join('');
  }

  function escapeHtml(s){ if (s===null||s===undefined) return ''; return (''+s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  function highlightReportOnMap(r) {
    if (!r || !r.resolved_lat || !r.resolved_lon) return;
    map.setView([r.resolved_lat, r.resolved_lon], 16);
  }

  async function resolve(id, btn){
    if (!confirm('Mark report #' + id + ' resolved?')) return;
    try {
      const res = await fetch(`/report/${id}/resolve`, {method:'POST'});
      if (res.ok) { alert('resolved'); await refreshNow(); }
      else alert('error marking resolved');
    } catch(e){ alert('error'); }
  }

  async function forceRecompute(report_id, btn){
    btn.disabled = true;
    btn.textContent = 'Refreshing...';
    try {
      const res = await fetch(`/report/${report_id}/recompute_eta`, {method:'POST'});
      const j = await res.json();
      if (res.ok && j.assigned_helpers) {
        // update UI: reload reports to reflect new ETA
        await refreshNow();
      } else {
        alert('Recompute failed: ' + (j.detail||''));
      }
    } catch (e) {
      alert('error recomputing');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Refresh ETA (force)';
    }
  }

  // recompute all helper ETAs (use sparingly!)
  document.getElementById('forceAll').addEventListener('click', async ()=>{
    if (!confirm('Force recompute ETA for all visible reports? This will call ORS for each report and may be rate-limited.')) return;
    const items = document.querySelectorAll('.report-item');
    for (const it of items) {
      const rid = Number(it.dataset.rid);
      const btn = it.querySelector('button');
      if (btn) btn.disabled = true;
      try { await fetch(`/report/${rid}/recompute_eta`, {method:'POST'}); }
      catch(e){ console.warn('err',e); }
      if (btn) { btn.disabled=false; }
    }
    await refreshNow();
  });

  async function renderOnMap(reports) {
    clearMap();
    const bounds = [];
    for (const r of reports) {
      if (r.resolved_lat && r.resolved_lon) {
        const pm = L.marker([r.resolved_lat, r.resolved_lon], {icon: reportIcon}).bindPopup(`<b>Report #${r.id}</b><div>${escapeHtml(r.message||'')}</div>`).addTo(reportLayer);
        markers.reports[r.id] = pm;
        bounds.push([r.resolved_lat, r.resolved_lon]);
      }
      if (r.assigned_helpers && r.assigned_helpers.length) {
        for (const h of r.assigned_helpers) {
          if (h.lat && h.lon) {
            const key = `h_${r.id}_${h.helper_id || (h.email||Math.random())}`;
            const hm = L.marker([h.lat, h.lon], {icon: helperIcon}).bindPopup(`<b>${escapeHtml(h.name||h.email||'Helper')}</b><div>${escapeHtml(h.email||'')}</div><div>ETA: ${escapeHtml(h.eta||'-')}</div>`).addTo(helperLayer);
            markers.helpers[key] = hm;
            bounds.push([h.lat, h.lon]);

            // draw simple line from helper -> report
            if (r.resolved_lat && r.resolved_lon) {
              const line = L.polyline([[h.lat, h.lon], [r.resolved_lat, r.resolved_lon]], {color:'#6c757d', weight:2, opacity:0.4, dashArray:'6 6'}).addTo(routeLayer);
            }
          }
        }
      }
    }
    if (bounds.length) {
      try { map.fitBounds(bounds, {padding:[60,60]}); }
      catch(e){}
    }
  }

  // top-level refresh function
  async function refreshNow(){
    const list = await fetchReports();
    const only = document.getElementById('emOnly').checked;
    const q = (document.getElementById('q').value || '').toLowerCase().trim();
    let visible = list;
    if (only) visible = visible.filter(r => r.is_emergency);
    if (q) visible = visible.filter(r => (r.message||'').toLowerCase().includes(q) || (r.location_text||'').toLowerCase().includes(q) || (JSON.stringify(r.assigned_helpers||[]).toLowerCase().includes(q)));

    // populate left list
    const container = document.getElementById('reportsList');
    container.innerHTML = '';
    for (const r of visible) {
      const item = buildReportItem(r);
      container.appendChild(item);
    }

    // map render
    await renderOnMap(visible);
  }

  // auto-refresh timer
  function startAutoRefresh(){
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(()=> {
      if (autoRefresh) refreshNow();
    }, REFRESH_INTERVAL);
  }

  document.getElementById('refreshBtn').addEventListener('click', ()=> refreshNow());
  document.getElementById('centerBtn').addEventListener('click', ()=>{
    if (!selectedReportId) { alert('No report selected'); return; }
    const el = document.querySelector(`[data-rid="${selectedReportId}"]`);
    if (el) el.click();
  });
  document.getElementById('pauseBtn').addEventListener('click', (ev)=>{
    autoRefresh = !autoRefresh;
    ev.target.textContent = autoRefresh ? 'Pause' : 'Resume';
  });

  // start
  (async ()=> {
    await refreshNow();
    startAutoRefresh();
    // countdown display
    let sec=REFRESH_INTERVAL/1000;
    setInterval(()=> {
      sec--;
      if (sec<=0) sec = REFRESH_INTERVAL/1000;
      document.getElementById('refreshSecs').textContent = sec;
    }, 1000);
  })();

  // center on report helper
  async function centerOnReport(id){
    const resp = await fetch(`/reports/recent?n=100`);
    if (!resp.ok) return;
    const arr = await resp.json();
    const r = arr.find(x=>x.id===id);
    if (!r) return;
    highlightReportOnMap(r);
  }
  </script>
</body>
</html>
